                  LinearLayout subList = new LinearLayout(this);
                  subList.setOrientation(LinearLayout.VERTICAL);

                  int currentSpuId = mediaPlayer.getSpuTrack();
                  if (spuTracks != null && spuTracks.length > 0) {
