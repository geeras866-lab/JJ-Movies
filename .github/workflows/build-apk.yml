name: Build JJ Movies Android APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:
    inputs:
      app_version:
        description: 'APK Version Number (e.g. 1.0.0, 1.0.1, 1.0.2)'
        required: true
        default: '1.0.0'
      version_code:
        description: 'Android Version Code (Integer: 1, 2, 3...)'
        required: true
        default: '1'

jobs:
  build-apk:
    runs-on: ubuntu-latest
    env:
      SITE_URL: https://jj-movies.pages.dev/

    steps:
      - name: 📥 Checkout Repository Code
        uses: actions/checkout@v4

      - name: ☕ Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: 🟢 Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: 📦 Prepare Web Assets & Inject APK Version
        run: |
          mkdir -p www
          cp index.html app.js style.css www/
          if [ -f admin.html ]; then cp admin.html www/; fi
          if [ -f offline.html ]; then cp offline.html www/; fi
          if [ -f sw.js ]; then cp sw.js www/; fi
          if [ -f tv.js ]; then cp tv.js www/; fi
          if [ -f tv.css ]; then cp tv.css www/; fi

          VER="${{ github.event.inputs.app_version || '1.0.0' }}"
          sed -i "1s/^/window.JJ_BUILD_VERSION = '${VER}';\n/" www/app.js

          npm init -y
          npm install @capacitor/core @capacitor/cli @capacitor/android @capacitor/app @capacitor/screen-orientation

          npx cap init "JJ Movies" "com.jjmovies.app" --web-dir www
          npx cap add android

      - name: 🔧 Configure Native Fullscreen Video & AndroidVlc Bridge
        run: |
          VER_NAME="${{ github.event.inputs.app_version || '1.0.0' }}"
          VER_CODE="${{ github.event.inputs.version_code || '1' }}"

          sed -i "s/versionCode 1/versionCode ${VER_CODE}/g" android/app/build.gradle
          sed -i "s/versionName \"1.0\"/versionName \"${VER_NAME}\"/g" android/app/build.gradle

          MANIFEST="android/app/src/main/AndroidManifest.xml"
          sed -i 's/<application/<application android:usesCleartextTraffic="true" android:hardwareAccelerated="true"/g' "$MANIFEST"
          sed -i 's/android:configChanges="[^"]*"/android:configChanges="orientation|keyboardHidden|keyboard|screenSize|locale|smallestScreenSize|screenLayout|uiMode|screenLayout|density|fontScale|layoutDirection"/g' "$MANIFEST"

          cat << 'EOF' > android/app/src/main/java/com/jjmovies/app/MainActivity.java
          package com.jjmovies.app;

          import android.content.Intent;
          import android.content.pm.ActivityInfo;
          import android.graphics.Color;
          import android.graphics.drawable.ColorDrawable;
          import android.os.Build;
          import android.os.Bundle;
          import android.view.View;
          import android.view.ViewGroup;
          import android.view.WindowManager;
          import android.webkit.JavascriptInterface;
          import android.webkit.WebChromeClient;
          import android.webkit.WebSettings;
          import android.webkit.WebView;
          import android.widget.FrameLayout;
          import com.getcapacitor.BridgeActivity;
          import com.getcapacitor.BridgeWebChromeClient;

          public class MainActivity extends BridgeActivity {

              private View customView;
              private WebChromeClient.CustomViewCallback customViewCallback;
              private FrameLayout fullscreenContainer;

              private void hideSystemUi() {
                  getWindow().getDecorView().setSystemUiVisibility(
                      View.SYSTEM_UI_FLAG_LAYOUT_STABLE
                      | View.SYSTEM_UI_FLAG_LAYOUT_HIDE_NAVIGATION
                      | View.SYSTEM_UI_FLAG_LAYOUT_FULLSCREEN
                      | View.SYSTEM_UI_FLAG_HIDE_NAVIGATION
                      | View.SYSTEM_UI_FLAG_FULLSCREEN
                      | View.SYSTEM_UI_FLAG_IMMERSIVE_STICKY
                  );
              }

              private void closeCustomView() {
                  if (customView == null) return;
                  ViewGroup decor = (ViewGroup) getWindow().getDecorView();
                  if (fullscreenContainer != null) {
                      decor.removeView(fullscreenContainer);
                  }
                  fullscreenContainer = null;
                  customView = null;
                  if (customViewCallback != null) {
                      customViewCallback.onCustomViewHidden();
                      customViewCallback = null;
                  }
                  setRequestedOrientation(ActivityInfo.SCREEN_ORIENTATION_UNSPECIFIED);
                  hideSystemUi();
              }

              @Override
              public void onCreate(Bundle savedInstanceState) {
                  super.onCreate(savedInstanceState);
                  getWindow().addFlags(WindowManager.LayoutParams.FLAG_KEEP_SCREEN_ON);

                  getWindow().setBackgroundDrawable(new ColorDrawable(Color.BLACK));
                  getWindow().setStatusBarColor(Color.BLACK);
                  getWindow().setNavigationBarColor(Color.BLACK);
                  getWindow().getDecorView().setBackgroundColor(Color.BLACK);

                  if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.R) {
                      WindowManager.LayoutParams lp = getWindow().getAttributes();
                      lp.layoutInDisplayCutoutMode =
                          WindowManager.LayoutParams.LAYOUT_IN_DISPLAY_CUTOUT_MODE_ALWAYS;
                      getWindow().setAttributes(lp);
                  } else if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.P) {
                      WindowManager.LayoutParams lp = getWindow().getAttributes();
                      lp.layoutInDisplayCutoutMode =
                          WindowManager.LayoutParams.LAYOUT_IN_DISPLAY_CUTOUT_MODE_SHORT_EDGES;
                      getWindow().setAttributes(lp);
                  }
                  hideSystemUi();

                  WebView wv = getBridge().getWebView();
                  WebSettings ws = wv.getSettings();
                  ws.setMediaPlaybackRequiresUserGesture(false);
                  ws.setJavaScriptEnabled(true);
                  ws.setDomStorageEnabled(true);

                  wv.addJavascriptInterface(new Object() {
                      @JavascriptInterface
                      public void playVideo(String url, String title) {
                          runOnUiThread(() -> {
                              Intent intent = new Intent(MainActivity.this, VlcPlayerActivity.class);
                              intent.putExtra(VlcPlayerActivity.EXTRA_VIDEO_URL, url);
                              intent.putExtra(VlcPlayerActivity.EXTRA_VIDEO_TITLE, title);
                              startActivity(intent);
                          });
                      }
                  }, "AndroidVlc");

                  wv.setWebChromeClient(new BridgeWebChromeClient(getBridge()) {
                      @Override
                      public void onShowCustomView(View view, WebChromeClient.CustomViewCallback callback) {
                          if (customView != null) {
                              callback.onCustomViewHidden();
                              return;
                          }
                          customView = view;
                          customViewCallback = callback;

                          fullscreenContainer = new FrameLayout(MainActivity.this);
                          fullscreenContainer.setBackgroundColor(Color.BLACK);
                          fullscreenContainer.addView(view, new FrameLayout.LayoutParams(
                              ViewGroup.LayoutParams.MATCH_PARENT,
                              ViewGroup.LayoutParams.MATCH_PARENT));

                          ((ViewGroup) getWindow().getDecorView()).addView(
                              fullscreenContainer,
                              new ViewGroup.LayoutParams(
                                  ViewGroup.LayoutParams.MATCH_PARENT,
                                  ViewGroup.LayoutParams.MATCH_PARENT));

                          setRequestedOrientation(ActivityInfo.SCREEN_ORIENTATION_SENSOR_LANDSCAPE);
                          hideSystemUi();
                      }

                      @Override
                      public void onHideCustomView() {
                          closeCustomView();
                      }
                  });
              }

              @Override
              public void onBackPressed() {
                  if (customView != null) {
                      closeCustomView();
                      return;
                  }
                  super.onBackPressed();
              }

              @Override
              public void onResume() {
                  super.onResume();
                  hideSystemUi();
              }

              @Override
              public void onWindowFocusChanged(boolean hasFocus) {
                  super.onWindowFocusChanged(hasFocus);
                  if (hasFocus) {
                      hideSystemUi();
                  }
              }
          }
          EOF

          python3 - << 'PYEOF'
          import re
          p = "android/app/src/main/res/values/styles.xml"
          s = open(p, encoding="utf-8").read()
          extra = (
              '\n        <item name="android:windowBackground">@android:color/black</item>'
              '\n        <item name="android:statusBarColor">@android:color/black</item>'
              '\n        <item name="android:navigationBarColor">@android:color/black</item>'
              '\n        <item name="android:windowLayoutInDisplayCutoutMode">shortEdges</item>'
          )
          s = re.sub(r'(<style name="AppTheme\.NoActionBar"[^>]*>)', r'\1' + extra, s, count=1)
          open(p, "w", encoding="utf-8").write(s)
          PYEOF

          node -e '
          const fs=require("fs");
          const f="capacitor.config.json";
          if(fs.existsSync(f)){
            const c=JSON.parse(fs.readFileSync(f,"utf8"));
            c.backgroundColor="#000000";
            c.android=Object.assign({},c.android,{backgroundColor:"#000000"});
            c.server=Object.assign({},c.server,{url:process.env.SITE_URL,cleartext:false,errorPath:"offline.html"});
            fs.writeFileSync(f,JSON.stringify(c,null,2));
          }'

      - name: 🎨 Generate Custom App Icon
        run: |
          npm install @capacitor/assets --save-dev
          npx capacitor-assets generate --android --iconBackgroundColor '#090d18' --iconBackgroundColorDark '#090d18'

          RES=android/app/src/main/res
          mkdir -p $RES/values
          printf '<?xml version="1.0" encoding="utf-8"?>\n<resources>\n    <color name="ic_launcher_background">#090D18</color>\n</resources>\n' > $RES/values/ic_launcher_background.xml

          for f in $RES/mipmap-anydpi-v26/ic_launcher.xml $RES/mipmap-anydpi-v26/ic_launcher_round.xml; do
            if [ -f "$f" ]; then
              sed -i 's#@mipmap/ic_launcher_background#@color/ic_launcher_background#g' "$f"
            fi
          done

      - name: 🔄 Sync Web Code to Android
        run: npx cap sync android

      - name: 🩹 Remove old Kotlin jdk7/jdk8 duplicate
        run: |
          cat >> android/build.gradle << 'EOF'

          allprojects {
              configurations.all {
                  exclude group: "org.jetbrains.kotlin", module: "kotlin-stdlib-jdk7"
                  exclude group: "org.jetbrains.kotlin", module: "kotlin-stdlib-jdk8"
              }
          }
          EOF

      - name: 🎬 Inject Native LibVLC Player & Controls
        run: |
          python3 - << 'PYEOF'
          p = "android/app/build.gradle"
          s = open(p, encoding="utf-8").read()
          if "libvlc-all" not in s:
              vlc_block = """
          android {
              defaultConfig {
                  ndk {
                      abiFilters "armeabi-v7a", "arm64-v8a"
                  }
              }
          }
          dependencies {
              implementation "org.videolan.android:libvlc-all:3.6.3"
              implementation "androidx.appcompat:appcompat:1.6.1"
          }
          """
              s = s + "\n" + vlc_block
              open(p, "w", encoding="utf-8").write(s)
          PYEOF

          python3 - << 'PYEOF'
          p = "android/app/src/main/AndroidManifest.xml"
          s = open(p, encoding="utf-8").read()
          if "VlcPlayerActivity" not in s:
              act = """        <activity
                      android:name=".VlcPlayerActivity"
                      android:exported="false"
                      android:screenOrientation="sensorLandscape"
                      android:configChanges="orientation|screenSize|keyboardHidden|smallestScreenSize|screenLayout|uiMode"
                      android:theme="@style/AppTheme.NoActionBar" />
          """
              s = s.replace("</application>", act + "</application>", 1)
              open(p, "w", encoding="utf-8").write(s)
          PYEOF

          mkdir -p android/app/src/main/res/drawable
          mkdir -p android/app/src/main/res/layout

          cat << 'EOF' > android/app/src/main/res/drawable/bg_vlc_circle.xml
          <?xml version="1.0" encoding="utf-8"?>
          <shape xmlns:android="http://schemas.android.com/apk/res/android" android:shape="oval">
              <solid android:color="#22000000" />
              <stroke android:width="2.2dp" android:color="#FFFFFF" />
          </shape>
          EOF

          cat << 'EOF' > android/app/src/main/res/drawable/ic_vlc_play.xml
