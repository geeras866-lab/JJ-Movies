                  TextView sizeHeader = new TextView(this);
                  sizeHeader.setText("Subtitle Size");
                  sizeHeader.setTextColor(Color.parseColor("#94A3B8"));
                  sizeHeader.setTextSize(12f);
                  sizeHeader.setTypeface(null, Typeface.BOLD);
                  sizeHeader.setPadding(itemPadH, Math.round(12 * density), itemPadH, Math.round(6 * density));
                  rightCol.addView(sizeHeader);

                  LinearLayout sizeRow = new LinearLayout(this);
                  sizeRow.setOrientation(LinearLayout.HORIZONTAL);
                  sizeRow.setPadding(itemPadH, 0, itemPadH, Math.round(4 * density));
                  rightCol.addView(sizeRow);

                  container.addView(leftCol);
                  container.addView(divider);
                  container.addView(rightCol);

                  AlertDialog dialog = new AlertDialog.Builder(this)
                          .setView(container)
                          .setOnDismissListener(d -> {
                              hideSystemUi();
                              scheduleHideControls();
                          })
                          .create();

                  bindDismissOnSelect(audioList, audioTracks, true, dialog);
                  bindDismissOnSelect(subList, spuTracks, false, dialog);

                  for (int i = 0; i < SUB_SIZE_VALUES.length; i++) {
                      final int sizeVal = SUB_SIZE_VALUES[i];
                      final String sizeLabel = SUB_SIZE_LABELS[i];
                      TextView chip = new TextView(this);
                      chip.setText(sizeLabel);
                      chip.setTextSize(11.5f);
                      chip.setGravity(Gravity.CENTER);
                      boolean active = (currentSubFontSize == sizeVal);
                      chip.setTextColor(active ? Color.WHITE : Color.parseColor("#CBD5E1"));
                      chip.setTypeface(null, active ? Typeface.BOLD : Typeface.NORMAL);
                      chip.setBackgroundColor(active ? Color.parseColor("#FF2450") : Color.parseColor("#1E293B"));
                      int cPadH = Math.round(8 * density);
                      int cPadV = Math.round(6 * density);
                      chip.setPadding(cPadH, cPadV, cPadH, cPadV);
                      LinearLayout.LayoutParams clp = new LinearLayout.LayoutParams(0, ViewGroup.LayoutParams.WRAP_CONTENT, 1f);
                      clp.setMargins(Math.round(2 * density), 0, Math.round(2 * density), 0);
                      chip.setLayoutParams(clp);
                      chip.setOnClickListener(v -> {
                          if (currentSubFontSize != sizeVal) {
                              currentSubFontSize = sizeVal;
                              getSharedPreferences(PREFS_NAME, MODE_PRIVATE).edit().putInt(KEY_SUB_SIZE, sizeVal).apply();
                              long pos = mediaPlayer != null ? mediaPlayer.getTime() : 0L;
                              int aId = mediaPlayer != null ? mediaPlayer.getAudioTrack() : Integer.MIN_VALUE;
                              int sId = mediaPlayer != null ? mediaPlayer.getSpuTrack() : Integer.MIN_VALUE;
                              Toast.makeText(this, "Subtitle Size: " + sizeLabel, Toast.LENGTH_SHORT).show();
                              dialog.dismiss();
                              initVlcPlayer(pos, aId, sId);
                          } else {
                              dialog.dismiss();
                          }
                      });
                      sizeRow.addView(chip);
                  }

                  dialog.show();
                  if (dialog.getWindow() != null) {
                      dialog.getWindow().setBackgroundDrawableResource(android.R.color.transparent);
                  }
              }

              private void bindDismissOnSelect(
                      LinearLayout listView,
                      MediaPlayer.TrackDescription[] tracks,
                      boolean isAudio,
                      AlertDialog dialog
              ) {
                  if (tracks == null) return;
                  int count = Math.min(listView.getChildCount(), tracks.length);
                  for (int i = 0; i < count; i++) {
                      final int idx = i;
                      MediaPlayer.TrackDescription tr = tracks[idx];
                      String label = (tr.name != null && !tr.name.trim().isEmpty())
                              ? tr.name.trim()
                              : (tr.id == -1 ? "Disable track" : ((isAudio ? "Audio Track " : "Subtitle ") + idx));
                      listView.getChildAt(i).setOnClickListener(v -> {
                          if (isAudio) {
                              mediaPlayer.setAudioTrack(tr.id);
                              Toast.makeText(this, "Audio: " + label, Toast.LENGTH_SHORT).show();
                          } else {
                              mediaPlayer.setSpuTrack(tr.id);
                              Toast.makeText(this, "Subtitle: " + label, Toast.LENGTH_SHORT).show();
                          }
                          dialog.dismiss();
                      });
                  }
              }

              private TextView buildTrackRow(String label, boolean selected, int padH, int padV) {
                  TextView tv = new TextView(this);
                  tv.setLayoutParams(new LinearLayout.LayoutParams(
                          ViewGroup.LayoutParams.MATCH_PARENT,
                          ViewGroup.LayoutParams.WRAP_CONTENT
                  ));
                  tv.setGravity(Gravity.CENTER_VERTICAL);
                  tv.setText((selected ? "✓  " : "    ") + label);
                  tv.setTextSize(13.5f);
                  tv.setTextColor(selected ? Color.WHITE : Color.parseColor("#B5BCCB"));
                  tv.setTypeface(null, selected ? Typeface.BOLD : Typeface.NORMAL);
                  tv.setPadding(padH, padV, padH, padV);
                  return tv;
              }

              @Override
              public void onBackPressed() {
                  if (isLocked) {
                      toggleControls();
                      return;
                  }
                  super.onBackPressed();
              }

              @Override
              public boolean onKeyDown(int keyCode, KeyEvent event) {
                  if (mediaPlayer != null && !isLocked) {
                      if (keyCode == KeyEvent.KEYCODE_DPAD_CENTER || keyCode == KeyEvent.KEYCODE_MEDIA_PLAY_PAUSE) {
                          togglePlayPause();
                          showControls();
                          return true;
                      }
                      if (keyCode == KeyEvent.KEYCODE_DPAD_RIGHT || keyCode == KeyEvent.KEYCODE_MEDIA_FAST_FORWARD) {
                          seekBy(10000L);
                          showBrandOverlay("⏩ +10s", true);
                          showControls();
                          return true;
                      }
                      if (keyCode == KeyEvent.KEYCODE_DPAD_LEFT || keyCode == KeyEvent.KEYCODE_MEDIA_REWIND) {
                          seekBy(-10000L);
                          showBrandOverlay("⏪ -10s", true);
                          showControls();
                          return true;
                      }
                  }
                  return super.onKeyDown(keyCode, event);
              }

              @Override
              protected void onStop() {
                  super.onStop();
                  if (mediaPlayer != null) mediaPlayer.stop();
              }

              @Override
              protected void onDestroy() {
                  super.onDestroy();
                  handler.removeCallbacksAndMessages(null);
                  if (mediaPlayer != null) {
                      mediaPlayer.detachViews();
                      mediaPlayer.release();
                      mediaPlayer = null;
                  }
                  if (libVLC != null) {
                      libVLC.release();
                      libVLC = null;
                  }
              }
          }
          EOF

      - name: 🔨 Build APK with Gradle
        working-directory: ./android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: 🚀 Copy Output APK
        run: |
          cp android/app/build/outputs/apk/debug/app-debug.apk ./jj-movies.apk

      - name: 📤 Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: jj-movies-v${{ github.event.inputs.app_version || '1.0.0' }}
          path: ./jj-movies.apk
