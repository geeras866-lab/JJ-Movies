name: Build JJ Movies Android APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:
    inputs:
      app_version:
        description: 'APK Version Number (e.g. 1.0.0, 1.0.1, 1.0.2)'
        required: true
        default: '1.0.0'
      version_code:
        description: 'Android Version Code (Integer: 1, 2, 3...)'
        required: true
        default: '1'

jobs:
  build-apk:
    runs-on: ubuntu-latest
    env:
      SITE_URL: https://jj-movies.pages.dev/

    steps:
      - name: 📥 Checkout Repository Code
        uses: actions/checkout@v4

      - name: ☕ Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: 🟢 Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: 📦 Prepare Web Assets & Inject APK Version
        run: |
          mkdir -p www
          cp index.html app.js style.css www/
          if [ -f admin.html ]; then cp admin.html www/; fi
          if [ -f offline.html ]; then cp offline.html www/; fi
          if [ -f sw.js ]; then cp sw.js www/; fi
          if [ -f tv.js ]; then cp tv.js www/; fi
          if [ -f tv.css ]; then cp tv.css www/; fi

          VER="${{ github.event.inputs.app_version || '1.0.0' }}"
          sed -i "1s/^/window.JJ_BUILD_VERSION = '${VER}';\n/" www/app.js

          npm init -y
          npm install @capacitor/core @capacitor/cli @capacitor/android @capacitor/app @capacitor/screen-orientation

          npx cap init "JJ Movies" "com.jjmovies.app" --web-dir www
          npx cap add android

      - name: 🔧 Configure Native Fullscreen Video & AndroidVlc Bridge
        run: |
          VER_NAME="${{ github.event.inputs.app_version || '1.0.0' }}"
          VER_CODE="${{ github.event.inputs.version_code || '1' }}"

          sed -i "s/versionCode 1/versionCode ${VER_CODE}/g" android/app/build.gradle
          sed -i "s/versionName \"1.0\"/versionName \"${VER_NAME}\"/g" android/app/build.gradle

          MANIFEST="android/app/src/main/AndroidManifest.xml"
          sed -i 's/<application/<application android:usesCleartextTraffic="true" android:hardwareAccelerated="true"/g' "$MANIFEST"
          sed -i 's/android:configChanges="[^"]*"/android:configChanges="orientation|keyboardHidden|keyboard|screenSize|locale|smallestScreenSize|screenLayout|uiMode|screenLayout|density|fontScale|layoutDirection"/g' "$MANIFEST"

          cat << 'EOF' > android/app/src/main/java/com/jjmovies/app/MainActivity.java
          package com.jjmovies.app;

          import android.content.Intent;
          import android.content.pm.ActivityInfo;
          import android.graphics.Color;
          import android.graphics.drawable.ColorDrawable;
          import android.os.Build;
          import android.os.Bundle;
          import android.view.View;
          import android.view.ViewGroup;
          import android.view.WindowManager;
          import android.webkit.JavascriptInterface;
          import android.webkit.WebChromeClient;
          import android.webkit.WebSettings;
          import android.webkit.WebView;
          import android.widget.FrameLayout;
          import com.getcapacitor.BridgeActivity;
          import com.getcapacitor.BridgeWebChromeClient;

          public class MainActivity extends BridgeActivity {

              private View customView;
              private WebChromeClient.CustomViewCallback customViewCallback;
              private FrameLayout fullscreenContainer;

              private void hideSystemUi() {
                  getWindow().getDecorView().setSystemUiVisibility(
                      View.SYSTEM_UI_FLAG_LAYOUT_STABLE
                      | View.SYSTEM_UI_FLAG_LAYOUT_HIDE_NAVIGATION
                      | View.SYSTEM_UI_FLAG_LAYOUT_FULLSCREEN
                      | View.SYSTEM_UI_FLAG_HIDE_NAVIGATION
                      | View.SYSTEM_UI_FLAG_FULLSCREEN
                      | View.SYSTEM_UI_FLAG_IMMERSIVE_STICKY
                  );
              }

              private void closeCustomView() {
                  if (customView == null) return;
                  ViewGroup decor = (ViewGroup) getWindow().getDecorView();
                  if (fullscreenContainer != null) {
                      decor.removeView(fullscreenContainer);
                  }
                  fullscreenContainer = null;
                  customView = null;
                  if (customViewCallback != null) {
                      customViewCallback.onCustomViewHidden();
                      customViewCallback = null;
                  }
                  setRequestedOrientation(ActivityInfo.SCREEN_ORIENTATION_UNSPECIFIED);
                  hideSystemUi();
              }

              @Override
              public void onCreate(Bundle savedInstanceState) {
                  super.onCreate(savedInstanceState);
                  getWindow().addFlags(WindowManager.LayoutParams.FLAG_KEEP_SCREEN_ON);

                  getWindow().setBackgroundDrawable(new ColorDrawable(Color.BLACK));
                  getWindow().setStatusBarColor(Color.BLACK);
                  getWindow().setNavigationBarColor(Color.BLACK);
                  getWindow().getDecorView().setBackgroundColor(Color.BLACK);

                  if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.R) {
                      WindowManager.LayoutParams lp = getWindow().getAttributes();
                      lp.layoutInDisplayCutoutMode =
                          WindowManager.LayoutParams.LAYOUT_IN_DISPLAY_CUTOUT_MODE_ALWAYS;
                      getWindow().setAttributes(lp);
                  } else if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.P) {
                      WindowManager.LayoutParams lp = getWindow().getAttributes();
                      lp.layoutInDisplayCutoutMode =
                          WindowManager.LayoutParams.LAYOUT_IN_DISPLAY_CUTOUT_MODE_SHORT_EDGES;
                      getWindow().setAttributes(lp);
                  }
                  hideSystemUi();

                  WebView wv = getBridge().getWebView();
                  WebSettings ws = wv.getSettings();
                  ws.setMediaPlaybackRequiresUserGesture(false);
                  ws.setJavaScriptEnabled(true);
                  ws.setDomStorageEnabled(true);

                  wv.addJavascriptInterface(new Object() {
                      @JavascriptInterface
                      public void playVideo(String url, String title) {
                          runOnUiThread(() -> {
                              Intent intent = new Intent(MainActivity.this, VlcPlayerActivity.class);
                              intent.putExtra(VlcPlayerActivity.EXTRA_VIDEO_URL, url);
                              intent.putExtra(VlcPlayerActivity.EXTRA_VIDEO_TITLE, title);
                              startActivity(intent);
                          });
                      }
                  }, "AndroidVlc");

                  wv.setWebChromeClient(new BridgeWebChromeClient(getBridge()) {
                      @Override
                      public void onShowCustomView(View view, WebChromeClient.CustomViewCallback callback) {
                          if (customView != null) {
                              callback.onCustomViewHidden();
                              return;
                          }
                          customView = view;
                          customViewCallback = callback;

                          fullscreenContainer = new FrameLayout(MainActivity.this);
                          fullscreenContainer.setBackgroundColor(Color.BLACK);
                          fullscreenContainer.addView(view, new FrameLayout.LayoutParams(
                              ViewGroup.LayoutParams.MATCH_PARENT,
                              ViewGroup.LayoutParams.MATCH_PARENT));

                          ((ViewGroup) getWindow().getDecorView()).addView(
                              fullscreenContainer,
                              new ViewGroup.LayoutParams(
                                  ViewGroup.LayoutParams.MATCH_PARENT,
                                  ViewGroup.LayoutParams.MATCH_PARENT));

                          setRequestedOrientation(ActivityInfo.SCREEN_ORIENTATION_SENSOR_LANDSCAPE);
                          hideSystemUi();
                      }

                      @Override
                      public void onHideCustomView() {
                          closeCustomView();
                      }
                  });
              }

              @Override
              public void onBackPressed() {
                  if (customView != null) {
                      closeCustomView();
                      return;
                  }
                  super.onBackPressed();
              }

              @Override
              public void onResume() {
                  super.onResume();
                  hideSystemUi();
              }

              @Override
              public void onWindowFocusChanged(boolean hasFocus) {
                  super.onWindowFocusChanged(hasFocus);
                  if (hasFocus) {
                      hideSystemUi();
                  }
              }
          }
          EOF

          python3 - << 'PYEOF'
          import re
          p = "android/app/src/main/res/values/styles.xml"
          s = open(p, encoding="utf-8").read()
          extra = (
              '\n        <item name="android:windowBackground">@android:color/black</item>'
              '\n        <item name="android:statusBarColor">@android:color/black</item>'
              '\n        <item name="android:navigationBarColor">@android:color/black</item>'
              '\n        <item name="android:windowLayoutInDisplayCutoutMode">shortEdges</item>'
          )
          s = re.sub(r'(<style name="AppTheme\.NoActionBar"[^>]*>)', r'\1' + extra, s, count=1)
          open(p, "w", encoding="utf-8").write(s)
          PYEOF

          node -e '
          const fs=require("fs");
          const f="capacitor.config.json";
          if(fs.existsSync(f)){
            const c=JSON.parse(fs.readFileSync(f,"utf8"));
            c.backgroundColor="#000000";
            c.android=Object.assign({},c.android,{backgroundColor:"#000000"});
            c.server=Object.assign({},c.server,{url:process.env.SITE_URL,cleartext:false,errorPath:"offline.html"});
            fs.writeFileSync(f,JSON.stringify(c,null,2));
          }'

      - name: 🎨 Generate Custom App Icon
        run: |
          npm install @capacitor/assets --save-dev
          npx capacitor-assets generate --android --iconBackgroundColor '#090d18' --iconBackgroundColorDark '#090d18'

          RES=android/app/src/main/res
          mkdir -p $RES/values
          printf '<?xml version="1.0" encoding="utf-8"?>\n<resources>\n    <color name="ic_launcher_background">#090D18</color>\n</resources>\n' > $RES/values/ic_launcher_background.xml

          for f in $RES/mipmap-anydpi-v26/ic_launcher.xml $RES/mipmap-anydpi-v26/ic_launcher_round.xml; do
            if [ -f "$f" ]; then
              sed -i 's#@mipmap/ic_launcher_background#@color/ic_launcher_background#g' "$f"
            fi
          done

      - name: 🔄 Sync Web Code to Android
        run: npx cap sync android

      - name: 🩹 Remove old Kotlin jdk7/jdk8 duplicate
        run: |
          cat >> android/build.gradle << 'EOF'

          allprojects {
              configurations.all {
                  exclude group: "org.jetbrains.kotlin", module: "kotlin-stdlib-jdk7"
                  exclude group: "org.jetbrains.kotlin", module: "kotlin-stdlib-jdk8"
              }
          }
          EOF

      - name: 🎬 Inject Native LibVLC Player & Controls
        run: |
          python3 - << 'PYEOF'
          p = "android/app/build.gradle"
          s = open(p, encoding="utf-8").read()
          if "libvlc-all" not in s:
              vlc_block = """
          android {
              defaultConfig {
                  ndk {
                      abiFilters "armeabi-v7a", "arm64-v8a"
                  }
              }
          }
          dependencies {
              implementation "org.videolan.android:libvlc-all:3.6.3"
              implementation "androidx.appcompat:appcompat:1.6.1"
          }
          """
              s = s + "\n" + vlc_block
              open(p, "w", encoding="utf-8").write(s)
          PYEOF

          python3 - << 'PYEOF'
          p = "android/app/src/main/AndroidManifest.xml"
          s = open(p, encoding="utf-8").read()
          if "VlcPlayerActivity" not in s:
              act = """        <activity
                      android:name=".VlcPlayerActivity"
                      android:exported="false"
                      android:screenOrientation="sensorLandscape"
                      android:configChanges="orientation|screenSize|keyboardHidden|smallestScreenSize|screenLayout|uiMode"
                      android:theme="@style/AppTheme.NoActionBar" />
          """
              s = s.replace("</application>", act + "</application>", 1)
              open(p, "w", encoding="utf-8").write(s)
          PYEOF

          mkdir -p android/app/src/main/res/drawable
          mkdir -p android/app/src/main/res/layout

          cat << 'EOF' > android/app/src/main/res/drawable/bg_vlc_circle.xml
          <?xml version="1.0" encoding="utf-8"?>
          <shape xmlns:android="http://schemas.android.com/apk/res/android" android:shape="oval">
              <solid android:color="#22000000" />
              <stroke android:width="2.2dp" android:color="#FFFFFF" />
          </shape>
          EOF

          cat << 'EOF' > android/app/src/main/res/drawable/bg_jj_hud_pill.xml
          <?xml version="1.0" encoding="utf-8"?>
          <shape xmlns:android="http://schemas.android.com/apk/res/android" android:shape="rectangle">
              <solid android:color="#CC0D1526" />
              <corners android:radius="14dp" />
              <stroke android:width="1dp" android:color="#44FF2450" />
          </shape>
          EOF

          cat << 'EOF' > android/app/src/main/res/drawable/ic_vlc_play.xml
          <vector xmlns:android="http://schemas.android.com/apk/res/android" android:width="28dp" android:height="28dp" android:viewportWidth="24" android:viewportHeight="24">
              <path android:fillColor="#FFFFFF" android:pathData="M8,5v14l11,-7z"/>
          </vector>
          EOF

          cat << 'EOF' > android/app/src/main/res/drawable/ic_vlc_pause.xml
          <vector xmlns:android="http://schemas.android.com/apk/res/android" android:width="28dp" android:height="28dp" android:viewportWidth="24" android:viewportHeight="24">
              <path android:fillColor="#FFFFFF" android:pathData="M6,19h4V5H6v14zM14,5v14h4V5h-4z"/>
          </vector>
          EOF

          cat << 'EOF' > android/app/src/main/res/drawable/ic_vlc_tracks.xml
          <vector xmlns:android="http://schemas.android.com/apk/res/android" android:width="24dp" android:height="24dp" android:viewportWidth="24" android:viewportHeight="24">
              <path android:fillColor="#FFFFFF" android:pathData="M20,4H4C2.9,4 2,4.9 2,6v12c0,1.1 0.9,2 2,2h16c1.1,0 2,-0.9 2,-2V6C22,4.9 21.1,4 20,4zM4,12h4v2H4V12zM14,18H4v-2h10V18zM20,18h-4v-2h4V18zM20,14H10v-2h10V14z"/>
          </vector>
          EOF

          cat << 'EOF' > android/app/src/main/res/drawable/ic_vlc_rotate.xml
          <vector xmlns:android="http://schemas.android.com/apk/res/android" android:width="24dp" android:height="24dp" android:viewportWidth="24" android:viewportHeight="24">
              <path android:fillColor="#FFFFFF" android:pathData="M16.48,2.52c3.27,1.55 5.61,4.72 5.97,8.48h1.5C23.44,4.84 18.29,0 12,0l-0.66,0.03 3.81,3.81 1.33,-1.32zM10.23,1.75c-0.59,-0.59 -1.54,-0.59 -2.12,0L1.75,8.11c-0.59,0.59 -0.59,1.54 0,2.12l12.02,12.02c0.59,0.59 1.54,0.59 2.12,0l6.36,-6.36c0.59,-0.59 0.59,-1.54 0,-2.12L10.23,1.75zM14.83,21.19L2.81,9.17l6.36,-6.36 12.02,12.02 -6.36,6.36z"/>
          </vector>
          EOF

          cat << 'EOF' > android/app/src/main/res/drawable/ic_vlc_aspect.xml
          <vector xmlns:android="http://schemas.android.com/apk/res/android" android:width="24dp" android:height="24dp" android:viewportWidth="24" android:viewportHeight="24">
              <path android:fillColor="#FFFFFF" android:pathData="M19,12h-2v3h-3v2h5v-5zM7,9h3V7H5v5h2V9zM21,3H3C1.9,3 1,3.9 1,5v14c0,1.1 0.9,2 2,2h18c1.1,0 2,-0.9 2,-2V5C23,3.9 22.1,3 21,3zM21,19.01H3V4.99h18V19.01z"/>
          </vector>
          EOF

          cat << 'EOF' > android/app/src/main/res/drawable/ic_vlc_lock.xml
          <vector xmlns:android="http://schemas.android.com/apk/res/android" android:width="24dp" android:height="24dp" android:viewportWidth="24" android:viewportHeight="24">
              <path android:fillColor="#FFFFFF" android:pathData="M18,8h-1V6c0,-2.76 -2.24,-5 -5,-5S7,3.24 7,6v2H6c-1.1,0 -2,0.9 -2,2v10c0,1.1 0.9,2 2,2h12c1.1,0 2,-0.9 2,-2V10C20,8.9 19.1,8 18,8zM12,17c-1.1,0 -2,-0.9 -2,-2s0.9,-2 2,-2 2,0.9 2,2S13.1,17 12,17zM15.1,8H8.9V6c0,-1.71 1.39,-3.1 3.1,-3.1 1.71,0 3.1,1.39 3.1,3.1v2z"/>
          </vector>
          EOF

          cat << 'EOF' > android/app/src/main/res/drawable/ic_vlc_back.xml
          <vector xmlns:android="http://schemas.android.com/apk/res/android" android:width="24dp" android:height="24dp" android:viewportWidth="24" android:viewportHeight="24">
              <path android:fillColor="#FFFFFF" android:pathData="M20,11H7.83l5.59,-5.59L12,4l-8,8 8,8 1.41,-1.41L7.83,13H20v-2z"/>
          </vector>
          EOF

          cat << 'EOF' > android/app/src/main/res/drawable/bg_vlc_top_grad.xml
          <?xml version="1.0" encoding="utf-8"?>
          <shape xmlns:android="http://schemas.android.com/apk/res/android">
              <gradient android:angle="270" android:startColor="#CC000000" android:endColor="#00000000" />
          </shape>
          EOF

          cat << 'EOF' > android/app/src/main/res/drawable/bg_vlc_bottom_grad.xml
          <?xml version="1.0" encoding="utf-8"?>
          <shape xmlns:android="http://schemas.android.com/apk/res/android">
              <gradient android:angle="90" android:startColor="#DD000000" android:endColor="#00000000" />
          </shape>
          EOF

          cat << 'EOF' > android/app/src/main/res/layout/activity_vlc_player.xml
          <?xml version="1.0" encoding="utf-8"?>
          <RelativeLayout xmlns:android="http://schemas.android.com/apk/res/android"
              android:id="@+id/vlc_root"
              android:layout_width="match_parent"
              android:layout_height="match_parent"
              android:background="#000000">

              <org.videolan.libvlc.util.VLCVideoLayout
                  android:id="@+id/vlc_video_layout"
                  android:layout_width="match_parent"
                  android:layout_height="match_parent" />

              <!-- Center Buffer / Seek JJ Movies Brand Overlay -->
              <LinearLayout
                  android:id="@+id/loading_brand_container"
                  android:layout_width="wrap_content"
                  android:layout_height="wrap_content"
                  android:layout_centerInParent="true"
                  android:background="@drawable/bg_jj_hud_pill"
                  android:gravity="center"
                  android:orientation="vertical"
                  android:paddingStart="22dp"
                  android:paddingTop="14dp"
                  android:paddingEnd="22dp"
                  android:paddingBottom="14dp"
                  android:visibility="visible">

                  <ProgressBar
                      android:id="@+id/vlc_loading"
                      android:layout_width="38dp"
                      android:layout_height="38dp"
                      android:indeterminateTint="#FF2450" />

                  <TextView
                      android:id="@+id/tv_loading_brand"
                      android:layout_width="wrap_content"
                      android:layout_height="wrap_content"
                      android:layout_marginTop="8dp"
                      android:letterSpacing="0.14"
                      android:text="JJ MOVIES"
                      android:textColor="#FFFFFF"
                      android:textSize="14sp"
                      android:textStyle="bold" />

                  <TextView
                      android:id="@+id/tv_loading_sub"
                      android:layout_width="wrap_content"
                      android:layout_height="wrap_content"
                      android:layout_marginTop="2dp"
                      android:text="Loading..."
                      android:textColor="#FF6B00"
                      android:textSize="11sp" />
              </LinearLayout>

              <!-- Center Gesture HUD (Brightness / Volume / Seek) -->
              <TextView
                  android:id="@+id/tv_gesture_hud"
                  android:layout_width="wrap_content"
                  android:layout_height="wrap_content"
                  android:layout_centerInParent="true"
                  android:background="@drawable/bg_jj_hud_pill"
                  android:paddingStart="20dp"
                  android:paddingTop="10dp"
                  android:paddingEnd="20dp"
                  android:paddingBottom="10dp"
                  android:textColor="#FFFFFF"
                  android:textSize="15sp"
                  android:textStyle="bold"
                  android:visibility="gone" />

              <ImageButton
                  android:id="@+id/btn_unlock"
                  android:layout_width="48dp"
                  android:layout_height="48dp"
                  android:layout_alignParentStart="true"
                  android:layout_centerVertical="true"
                  android:layout_marginStart="24dp"
                  android:background="@drawable/bg_vlc_circle"
                  android:padding="12dp"
                  android:scaleType="fitCenter"
                  android:src="@drawable/ic_vlc_lock"
                  android:visibility="gone" />

              <RelativeLayout
                  android:id="@+id/controls_overlay"
                  android:layout_width="match_parent"
                  android:layout_height="match_parent">

                  <RelativeLayout
                      android:layout_width="match_parent"
                      android:layout_height="68dp"
                      android:layout_alignParentTop="true"
                      android:background="@drawable/bg_vlc_top_grad"
                      android:paddingStart="16dp"
                      android:paddingEnd="16dp">

                      <ImageButton
                          android:id="@+id/btn_back"
                          android:layout_width="40dp"
                          android:layout_height="40dp"
                          android:layout_alignParentStart="true"
                          android:layout_centerVertical="true"
                          android:background="?attr/selectableItemBackgroundBorderless"
                          android:padding="8dp"
                          android:src="@drawable/ic_vlc_back" />

                      <TextView
                          android:id="@+id/tv_video_title"
                          android:layout_width="match_parent"
                          android:layout_height="wrap_content"
                          android:layout_centerInParent="true"
                          android:layout_marginStart="56dp"
                          android:layout_marginEnd="56dp"
                          android:ellipsize="end"
                          android:gravity="center"
                          android:maxLines="1"
                          android:text="JJ Movies"
                          android:textColor="#FFFFFF"
                          android:textSize="17sp" />
                  </RelativeLayout>

                  <LinearLayout
                      android:layout_width="match_parent"
                      android:layout_height="wrap_content"
                      android:layout_alignParentBottom="true"
                      android:background="@drawable/bg_vlc_bottom_grad"
                      android:orientation="vertical"
                      android:paddingStart="24dp"
                      android:paddingTop="24dp"
                      android:paddingEnd="24dp"
                      android:paddingBottom="14dp">

                      <RelativeLayout
                          android:layout_width="match_parent"
                          android:layout_height="wrap_content"
                          android:paddingStart="4dp"
                          android:paddingEnd="4dp">

                          <TextView
                              android:id="@+id/tv_current_time"
                              android:layout_width="wrap_content"
                              android:layout_height="wrap_content"
                              android:layout_alignParentStart="true"
                              android:text="0:00"
                              android:textColor="#FFFFFF"
                              android:textSize="12sp" />

                          <TextView
                              android:id="@+id/tv_total_time"
                              android:layout_width="wrap_content"
                              android:layout_height="wrap_content"
                              android:layout_alignParentEnd="true"
                              android:text="0:00"
                              android:textColor="#E2E8F0"
                              android:textSize="12sp" />
                      </RelativeLayout>

                      <SeekBar
                          android:id="@+id/vlc_seekbar"
                          android:layout_width="match_parent"
                          android:layout_height="wrap_content"
                          android:layout_marginTop="2dp"
                          android:layout_marginBottom="8dp"
                          android:paddingStart="6dp"
                          android:paddingEnd="6dp"
                          android:progressBackgroundTint="#55FFFFFF"
                          android:progressTint="#FF6B00"
                          android:thumbTint="#FF6B00" />

                      <RelativeLayout
                          android:layout_width="match_parent"
                          android:layout_height="52dp">

                          <LinearLayout
                              android:layout_width="wrap_content"
                              android:layout_height="match_parent"
                              android:layout_alignParentStart="true"
                              android:gravity="center_vertical"
                              android:orientation="horizontal">

                              <ImageButton
                                  android:id="@+id/btn_tracks"
                                  android:layout_width="42dp"
                                  android:layout_height="42dp"
                                  android:background="?attr/selectableItemBackgroundBorderless"
                                  android:padding="9dp"
                                  android:scaleType="fitCenter"
                                  android:src="@drawable/ic_vlc_tracks" />

                              <ImageButton
                                  android:id="@+id/btn_rotate"
                                  android:layout_width="42dp"
                                  android:layout_height="42dp"
                                  android:layout_marginStart="14dp"
                                  android:background="?attr/selectableItemBackgroundBorderless"
                                  android:padding="9dp"
                                  android:scaleType="fitCenter"
                                  android:src="@drawable/ic_vlc_rotate" />
                          </LinearLayout>

                          <ImageButton
                              android:id="@+id/btn_play_pause"
                              android:layout_width="48dp"
                              android:layout_height="48dp"
                              android:layout_centerInParent="true"
                              android:background="@drawable/bg_vlc_circle"
                              android:padding="11dp"
                              android:scaleType="fitCenter"
                              android:src="@drawable/ic_vlc_pause" />

                          <LinearLayout
