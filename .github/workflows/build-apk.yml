              private void adjustSubtitleClearanceForControls(boolean showClearance) {
                  if (videoLayout == null) return;
                  float density = getResources().getDisplayMetrics().density;
                  int bottomLiftPx = showClearance ? Math.round(78 * density) : Math.round(16 * density);
                  ViewGroup.LayoutParams lp = videoLayout.getLayoutParams();
                  if (lp instanceof ViewGroup.MarginLayoutParams) {
                      ViewGroup.MarginLayoutParams mlp = (ViewGroup.MarginLayoutParams) lp;
                      mlp.bottomMargin = showClearance ? Math.round(52 * density) : 0;
                      videoLayout.setLayoutParams(mlp);
                  }
                  videoLayout.setPadding(
                      videoLayout.getPaddingLeft(),
                      videoLayout.getPaddingTop(),
                      videoLayout.getPaddingRight(),
                      bottomLiftPx
                  );
              }

