name: Build JJ Movies Android APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:
    inputs:
      app_version:
        description: 'APK Version Number (e.g. 1.0.0, 1.0.1, 1.0.2)'
        required: true
        default: '1.0.0'
      version_code:
        description: 'Android Version Code (Integer: 1, 2, 3...)'
        required: true
        default: '1'

jobs:
  build-apk:
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Checkout Repository Code
        uses: actions/checkout@v4

      - name: ☕ Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: 🟢 Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: 📦 Prepare Web Assets & Inject APK Version
        run: |
          mkdir -p www
          cp index.html app.js style.css www/
          if [ -f admin.html ]; then cp admin.html www/; fi

          VER="${{ github.event.inputs.app_version || '1.0.0' }}"
          sed -i "1s/^/window.JJ_BUILD_VERSION = '${VER}';\n/" www/app.js

          npm init -y
          npm install @capacitor/core @capacitor/cli @capacitor/android @capacitor/app

          npx cap init "JJ Movies" "com.jjmovies.app" --web-dir www
          npx cap add android

      - name: 🔧 Configure True Immersive Fullscreen & Auto-Landscape in Android
        run: |
          VER_NAME="${{ github.event.inputs.app_version || '1.0.0' }}"
          VER_CODE="${{ github.event.inputs.version_code || '1' }}"
          
          sed -i "s/versionCode 1/versionCode ${VER_CODE}/g" android/app/build.gradle
          sed -i "s/versionName \"1.0\"/versionName \"${VER_NAME}\"/g" android/app/build.gradle

          MANIFEST="android/app/src/main/AndroidManifest.xml"
          sed -i 's/<application/<application android:usesCleartextTraffic="true" android:hardwareAccelerated="true"/g' "$MANIFEST"
          sed -i 's/android:configChanges="[^"]*"/android:configChanges="orientation|keyboardHidden|keyboard|screenSize|locale|smallestScreenSize|screenLayout|uiMode"/g' "$MANIFEST"

          # Inject Native Immersive Fullscreen into MainActivity.java
          cat << 'EOF' > android/app/src/main/java/com/jjmovies/app/MainActivity.java
          package com.jjmovies.app;

          import android.os.Bundle;
          import android.view.View;
          import android.view.WindowManager;
          import com.getcapacitor.BridgeActivity;

          public class MainActivity extends BridgeActivity {
              @Override
              public void onCreate(Bundle savedInstanceState) {
                  super.onCreate(savedInstanceState);
                  getWindow().addFlags(WindowManager.LayoutParams.FLAG_KEEP_SCREEN_ON);
              }

              @Override
              public void onWindowFocusChanged(boolean hasFocus) {
                  super.onWindowFocusChanged(hasFocus);
                  if (hasFocus) {
                      getWindow().getDecorView().setSystemUiVisibility(
                          View.SYSTEM_UI_FLAG_LAYOUT_STABLE
                          | View.SYSTEM_UI_FLAG_FULLSCREEN
                          | View.SYSTEM_UI_FLAG_IMMERSIVE_STICKY
                      );
                  }
              }
          }
          EOF

      - name: 🔄 Sync Web Code to Android
        run: npx cap sync android

      - name: 🔨 Build APK with Gradle
        working-directory: ./android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: 🚀 Copy Output APK
        run: |
          cp android/app/build/outputs/apk/debug/app-debug.apk ./jj-movies.apk

      - name: 📤 Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: jj-movies-v${{ github.event.inputs.app_version || '1.0.0' }}
          path: ./jj-movies.apk
