                                  ? tr.name.trim()
                                  : (tr.id == -1 ? "Disable track" : ("Subtitle " + i));
                          subList.addView(buildTrackRow(label, tr.id == currentSpuId, itemPadH, itemPadV));
                      }
                  } else {
                      TextView emptySub = new TextView(this);
