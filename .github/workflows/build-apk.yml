name: Build JJ Movies Android APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:
    inputs:
      app_version:
        description: 'APK Version Number (e.g. 1.0.0, 1.0.1, 1.0.2)'
        required: true
        default: '1.0.0'
      version_code:
        description: 'Android Version Code (Integer: 1, 2, 3...)'
        required: true
        default: '1'

jobs:
  build-apk:
    runs-on: ubuntu-latest
    env:
      SITE_URL: https://jj-movies.pages.dev/

    steps:
      - name: Checkout Repository Code
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Prepare Web Assets & Inject APK Version
        run: |
          mkdir -p www
          cp index.html app.js style.css www/
          if [ -f admin.html ]; then cp admin.html www/; fi
          if [ -f offline.html ]; then cp offline.html www/; fi
          if [ -f sw.js ]; then cp sw.js www/; fi
          if [ -f tv.js ]; then cp tv.js www/; fi
          if [ -f tv.css ]; then cp tv.css www/; fi

          VER="${{ github.event.inputs.app_version || '1.0.0' }}"
          sed -i "1s/^/window.JJ_BUILD_VERSION = '${VER}';\n/" www/app.js

          npm init -y
          npm install @capacitor/core @capacitor/cli @capacitor/android @capacitor/app @capacitor/screen-orientation

          npx cap init "JJ Movies" "com.jjmovies.app" --web-dir www
          npx cap add android

      - name: Configure Native Fullscreen Video & MainActivity Bridge
        run: |
          VER_NAME="${{ github.event.inputs.app_version || '1.0.0' }}"
          VER_CODE="${{ github.event.inputs.version_code || '1' }}"

          sed -i "s/versionCode 1/versionCode ${VER_CODE}/g" android/app/build.gradle
          sed -i "s/versionName \"1.0\"/versionName \"${VER_NAME}\"/g" android/app/build.gradle

          MANIFEST="android/app/src/main/AndroidManifest.xml"
          sed -i 's/<application/<application android:usesCleartextTraffic="true" android:hardwareAccelerated="true"/g' "$MANIFEST"
          sed -i 's/android:configChanges="[^"]*"/android:configChanges="orientation|keyboardHidden|keyboard|screenSize|locale|smallestScreenSize|screenLayout|uiMode|screenLayout|density|fontScale|layoutDirection"/g' "$MANIFEST"

          cat << 'EOF' > android/app/src/main/java/com/jjmovies/app/MainActivity.java
          package com.jjmovies.app;

          import android.content.Intent;
          import android.content.pm.ActivityInfo;
          import android.graphics.Color;
          import android.graphics.drawable.ColorDrawable;
          import android.os.Build;
          import android.os.Bundle;
          import android.view.View;
          import android.view.ViewGroup;
          import android.view.WindowManager;
          import android.webkit.JavascriptInterface;
          import android.webkit.WebChromeClient;
          import android.webkit.WebSettings;
          import android.webkit.WebView;
          import android.widget.FrameLayout;
          import com.getcapacitor.BridgeActivity;
          import com.getcapacitor.BridgeWebChromeClient;

          public class MainActivity extends BridgeActivity {

              private View customView;
              private WebChromeClient.CustomViewCallback customViewCallback;
              private FrameLayout fullscreenContainer;

              private void hideSystemUi() {
                  getWindow().getDecorView().setSystemUiVisibility(
                      View.SYSTEM_UI_FLAG_LAYOUT_STABLE
                      | View.SYSTEM_UI_FLAG_LAYOUT_HIDE_NAVIGATION
                      | View.SYSTEM_UI_FLAG_FULLSCREEN
                      | View.SYSTEM_UI_FLAG_HIDE_NAVIGATION
                      | View.SYSTEM_UI_FLAG_FULLSCREEN
                      | View.SYSTEM_UI_FLAG_IMMERSIVE_STICKY
                  );
              }

              private void closeCustomView() {
                  if (customView == null) return;
                  ViewGroup decor = (ViewGroup) getWindow().getDecorView();
                  if (fullscreenContainer != null) {
                      decor.removeView(fullscreenContainer);
                  }
                  fullscreenContainer = null;
                  customView = null;
                  if (customViewCallback != null) {
                      customViewCallback.onCustomViewHidden();
                      customViewCallback = null;
                  }
                  setRequestedOrientation(ActivityInfo.SCREEN_ORIENTATION_UNSPECIFIED);
                  hideSystemUi();
              }

              @Override
              public void onCreate(Bundle savedInstanceState) {
                  super.onCreate(savedInstanceState);
                  getWindow().addFlags(WindowManager.LayoutParams.FLAG_KEEP_SCREEN_ON);

                  getWindow().setBackgroundDrawable(new ColorDrawable(Color.BLACK));
                  getWindow().setStatusBarColor(Color.BLACK);
                  getWindow().setNavigationBarColor(Color.BLACK);
                  getWindow().getDecorView().setBackgroundColor(Color.BLACK);

                  if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.R) {
                      WindowManager.LayoutParams lp = getWindow().getAttributes();
                      lp.layoutInDisplayCutoutMode =
                          WindowManager.LayoutParams.LAYOUT_IN_DISPLAY_CUTOUT_MODE_ALWAYS;
                      getWindow().setAttributes(lp);
                  } else if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.P) {
                      WindowManager.LayoutParams lp = getWindow().getAttributes();
                      lp.layoutInDisplayCutoutMode =
                          WindowManager.LayoutParams.LAYOUT_IN_DISPLAY_CUTOUT_MODE_SHORT_EDGES;
                      getWindow().setAttributes(lp);
                  }
                  hideSystemUi();

                  WebView wv = getBridge().getWebView();
                  WebSettings ws = wv.getSettings();
                  ws.setMediaPlaybackRequiresUserGesture(false);
                  ws.setJavaScriptEnabled(true);
                  ws.setDomStorageEnabled(true);

                  wv.addJavascriptInterface(new Object() {
                      @JavascriptInterface
                      public void playVideo(String url, String title) {
                          runOnUiThread(() -> {
                              Intent intent = new Intent(MainActivity.this, VlcPlayerActivity.class);
                              intent.putExtra(VlcPlayerActivity.EXTRA_VIDEO_URL, url);
                              intent.putExtra(VlcPlayerActivity.EXTRA_VIDEO_TITLE, title);
                              startActivity(intent);
                          });
                      }
                  }, "AndroidVlc");

                  wv.setWebChromeClient(new BridgeWebChromeClient(getBridge()) {
                      @Override
                      public void onShowCustomView(View view, WebChromeClient.CustomViewCallback callback) {
                          if (customView != null) {
                              callback.onCustomViewHidden();
                              return;
                          }
                          customView = view;
                          customViewCallback = callback;

                          fullscreenContainer = new FrameLayout(MainActivity.this);
                          fullscreenContainer.setBackgroundColor(Color.BLACK);
                          fullscreenContainer.addView(view, new FrameLayout.LayoutParams(
                              ViewGroup.LayoutParams.MATCH_PARENT,
                              ViewGroup.LayoutParams.MATCH_PARENT));

                          ((ViewGroup) getWindow().getDecorView()).addView(
                              fullscreenContainer,
                              new ViewGroup.LayoutParams(
                                  ViewGroup.LayoutParams.MATCH_PARENT,
                                  ViewGroup.LayoutParams.MATCH_PARENT));

                          setRequestedOrientation(ActivityInfo.SCREEN_ORIENTATION_SENSOR_LANDSCAPE);
                          hideSystemUi();
                      }

                      @Override
                      public void onHideCustomView() {
                          closeCustomView();
                      }
                  });
              }

              @Override
              public void onBackPressed() {
                  if (customView != null) {
                      closeCustomView();
                      return;
                  }
                  super.onBackPressed();
              }

              @Override
              public void onResume() {
                  super.onResume();
                  hideSystemUi();
              }

              @Override
              public void onWindowFocusChanged(boolean hasFocus) {
                  super.onWindowFocusChanged(hasFocus);
                  if (hasFocus) {
                      hideSystemUi();
                  }
              }
          }
          EOF

          python3 - << 'PYEOF'
          import re
          p = "android/app/src/main/res/values/styles.xml"
          s = open(p, encoding="utf-8").read()
          extra = (
              '\n        <item name="android:windowBackground">@android:color/black</item>'
              '\n        <item name="android:statusBarColor">@android:color/black</item>'
              '\n        <item name="android:navigationBarColor">@android:color/black</item>'
              '\n        <item name="android:windowLayoutInDisplayCutoutMode">shortEdges</item>'
          )
          s = re.sub(r'(<style name="AppTheme\.NoActionBar"[^>]*>)', r'\1' + extra, s, count=1)
          open(p, "w", encoding="utf-8").write(s)
          PYEOF

          node -e '
          const fs=require("fs");
          const f="capacitor.config.json";
          if(fs.existsSync(f)){
            const c=JSON.parse(fs.readFileSync(f,"utf8"));
            c.backgroundColor="#000000";
            c.android=Object.assign({},c.android,{backgroundColor:"#000000"});
            c.server=Object.assign({},c.server,{url:process.env.SITE_URL,cleartext:false,errorPath:"offline.html"});
            fs.writeFileSync(f,JSON.stringify(c,null,2));
          }'

      - name: Generate Custom App Icon
        run: |
          npm install @capacitor/assets --save-dev
          npx capacitor-assets generate --android --iconBackgroundColor '#090d18' --iconBackgroundColorDark '#090d18'

          RES=android/app/src/main/res
          mkdir -p $RES/values
          printf '<?xml version="1.0" encoding="utf-8"?>\n<resources>\n    <color name="ic_launcher_background">#090D18</color>\n</resources>\n' > $RES/values/ic_launcher_background.xml

          for f in $RES/mipmap-anydpi-v26/ic_launcher.xml $RES/mipmap-anydpi-v26/ic_launcher_round.xml; do
            if [ -f "$f" ]; then
              sed -i 's#@mipmap/ic_launcher_background#@color/ic_launcher_background#g' "$f"
            fi
          done

      - name: Sync Web Code to Android
        run: npx cap sync android

      - name: Remove old Kotlin jdk7/jdk8 duplicate
        run: |
          cat >> android/build.gradle << 'EOF'

          allprojects {
              configurations.all {
                  exclude group: "org.jetbrains.kotlin", module: "kotlin-stdlib-jdk7"
                  exclude group: "org.jetbrains.kotlin", module: "kotlin-stdlib-jdk8"
              }
          }
          EOF

      - name: Inject Native LibVLC Player & Controls
        run: |
          python3 - << 'PYEOF'
          p = "android/app/build.gradle"
          s = open(p, encoding="utf-8").read()
          if "libvlc-all" not in s:
              vlc_block = """
          android {
              defaultConfig {
                  ndk {
                      abiFilters "armeabi-v7a", "arm64-v8a"
                  }
              }
          }
          dependencies {
              implementation "org.videolan.android:libvlc-all:3.6.3"
              implementation "androidx.appcompat:appcompat:1.6.1"
          }
          """
              s = s + "\n" + vlc_block
              open(p, "w", encoding="utf-8").write(s)
          PYEOF

          python3 - << 'PYEOF'
          p = "android/app/src/main/AndroidManifest.xml"
          s = open(p, encoding="utf-8").read()
          if "VlcPlayerActivity" not in s:
              act = """        <activity
                      android:name=".VlcPlayerActivity"
                      android:exported="false"
                      android:configChanges="orientation|screenSize|keyboardHidden|smallestScreenSize|screenLayout|uiMode"
                      android:theme="@style/AppTheme.NoActionBar" />
          """
              s = s.replace("</application>", act + "</application>", 1)
              open(p, "w", encoding="utf-8").write(s)
          PYEOF

          mkdir -p android/app/src/main/res/layout
          cat << 'EOF' > android/app/src/main/res/layout/activity_vlc_player.xml
          <?xml version="1.0" encoding="utf-8"?>
          <RelativeLayout xmlns:android="http://schemas.android.com/apk/res/android"
              android:layout_width="match_parent"
              android:layout_height="match_parent"
              android:background="#000000">

              <org.videolan.libvlc.util.VLCVideoLayout
                  android:id="@+id/vlc_video_layout"
                  android:layout_width="match_parent"
                  android:layout_height="match_parent" />

              <LinearLayout
                  android:layout_width="wrap_content"
                  android:layout_height="wrap_content"
                  android:layout_alignParentTop="true"
                  android:layout_alignParentEnd="true"
                  android:layout_margin="12dp"
                  android:orientation="horizontal">

                  <Button
                      android:id="@+id/btn_audio_tracks"
                      android:layout_width="wrap_content"
                      android:layout_height="wrap_content"
                      android:text="Audio" />

                  <Button
                      android:id="@+id/btn_sub_tracks"
                      android:layout_width="wrap_content"
                      android:layout_height="wrap_content"
                      android:layout_marginStart="8dp"
                      android:text="Subtitles" />
              </LinearLayout>

              <LinearLayout
                  android:layout_width="wrap_content"
                  android:layout_height="wrap_content"
                  android:layout_alignParentBottom="true"
                  android:layout_centerHorizontal="true"
                  android:layout_margin="16dp"
                  android:orientation="horizontal">

                  <Button
                      android:id="@+id/btn_seek_back"
                      android:layout_width="wrap_content"
                      android:layout_height="wrap_content"
                      android:text="-10s" />

                  <Button
                      android:id="@+id/btn_play_pause"
                      android:layout_width="wrap_content"
                      android:layout_height="wrap_content"
                      android:layout_marginStart="8dp"
                      android:text="Play/Pause" />

                  <Button
                      android:id="@+id/btn_seek_fwd"
                      android:layout_width="wrap_content"
                      android:layout_height="wrap_content"
                      android:layout_marginStart="8dp"
                      android:text="+10s" />
              </LinearLayout>

          </RelativeLayout>
          EOF

          cat << 'EOF' > android/app/src/main/java/com/jjmovies/app/VlcPlayerActivity.java
          package com.jjmovies.app;

          import android.app.AlertDialog;
          import android.net.Uri;
          import android.os.Bundle;
          import android.view.KeyEvent;
          import android.view.View;
          import android.view.WindowManager;
          import android.widget.Button;
          import android.widget.Toast;

          import androidx.appcompat.app.AppCompatActivity;

          import org.videolan.libvlc.LibVLC;
          import org.videolan.libvlc.Media;
          import org.videolan.libvlc.MediaPlayer;
          import org.videolan.libvlc.util.VLCVideoLayout;

          import java.util.ArrayList;

          public class VlcPlayerActivity extends AppCompatActivity {

              public static final String EXTRA_VIDEO_URL = "video_url";
              public static final String EXTRA_VIDEO_TITLE = "video_title";

              private LibVLC libVLC;
              private MediaPlayer mediaPlayer;
              private VLCVideoLayout videoLayout;

              @Override
              protected void onCreate(Bundle savedInstanceState) {
                  super.onCreate(savedInstanceState);
                  getWindow().addFlags(WindowManager.LayoutParams.FLAG_KEEP_SCREEN_ON);
                  getWindow().getDecorView().setSystemUiVisibility(
                      View.SYSTEM_UI_FLAG_FULLSCREEN
                      | View.SYSTEM_UI_FLAG_HIDE_NAVIGATION
                      | View.SYSTEM_UI_FLAG_IMMERSIVE_STICKY
                  );
                  setContentView(R.layout.activity_vlc_player);

                  String videoUrl = getIntent().getStringExtra(EXTRA_VIDEO_URL);
                  if (videoUrl == null || videoUrl.trim().isEmpty()) {
                      Toast.makeText(this, "Invalid video URL", Toast.LENGTH_SHORT).show();
                      finish();
                      return;
                  }

                  videoLayout = findViewById(R.id.vlc_video_layout);
                  Button btnAudio = findViewById(R.id.btn_audio_tracks);
                  Button btnSubs = findViewById(R.id.btn_sub_tracks);
                  Button btnSeekBack = findViewById(R.id.btn_seek_back);
                  Button btnPlayPause = findViewById(R.id.btn_play_pause);
                  Button btnSeekFwd = findViewById(R.id.btn_seek_fwd);

                  ArrayList<String> options = new ArrayList<>();
                  options.add("--aout=opensles");
                  options.add("--audio-time-stretch");
                  options.add("--network-caching=2500");
                  options.add("--file-caching=1500");
                  options.add("--live-caching=2500");

                  libVLC = new LibVLC(this, options);
                  mediaPlayer = new MediaPlayer(libVLC);
                  mediaPlayer.attachViews(videoLayout, null, false, false);

                  Media media = new Media(libVLC, Uri.parse(videoUrl.trim()));
                  media.setHWDecoderEnabled(true, false);
                  media.addOption(":network-caching=2500");
                  media.addOption(":http-reconnect");
                  media.addOption(":audio-passthrough");
                  mediaPlayer.setMedia(media);
                  media.release();

                  mediaPlayer.play();

                  if (btnAudio != null) btnAudio.setOnClickListener(v -> showAudioTrackDialog());
                  if (btnSubs != null) btnSubs.setOnClickListener(v -> showSubtitleTrackDialog());
                  if (btnPlayPause != null) btnPlayPause.setOnClickListener(v -> togglePlayPause());
                  if (btnSeekBack != null) btnSeekBack.setOnClickListener(v -> seekBy(-10000L));
                  if (btnSeekFwd != null) btnSeekFwd.setOnClickListener(v -> seekBy(10000L));
              }

              private void togglePlayPause() {
                  if (mediaPlayer == null) return;
                  if (mediaPlayer.isPlaying()) mediaPlayer.pause();
                  else mediaPlayer.play();
              }

              private void seekBy(long deltaMs) {
                  if (mediaPlayer == null) return;
                  long target = mediaPlayer.getTime() + deltaMs;
                  mediaPlayer.setTime(Math.max(0L, target));
              }

              private void showAudioTrackDialog() {
                  if (mediaPlayer == null) return;
                  MediaPlayer.TrackDescription[] tracks = mediaPlayer.getAudioTracks();
                  if (tracks == null || tracks.length == 0) {
                      Toast.makeText(this, "Audio tracks not loaded yet", Toast.LENGTH_SHORT).show();
                      return;
                  }

                  String[] names = new String[tracks.length];
                  int currentId = mediaPlayer.getAudioTrack();
                  int checkedIndex = 0;

                  for (int i = 0; i < tracks.length; i++) {
                      names[i] = tracks[i].name != null ? tracks[i].name : ("Audio Track " + i);
                      if (tracks[i].id == currentId) checkedIndex = i;
                  }

                  new AlertDialog.Builder(this)
                          .setTitle("Select Audio Language / Dolby")
                          .setSingleChoiceItems(names, checkedIndex, (dialog, which) -> {
                              mediaPlayer.setAudioTrack(tracks[which].id);
                              Toast.makeText(this, "Audio: " + names[which], Toast.LENGTH_SHORT).show();
                              dialog.dismiss();
                          })
                          .show();
              }

              private void showSubtitleTrackDialog() {
                  if (mediaPlayer == null) return;
                  MediaPlayer.TrackDescription[] tracks = mediaPlayer.getSpuTracks();
                  if (tracks == null || tracks.length == 0) {
                      Toast.makeText(this, "No subtitles available", Toast.LENGTH_SHORT).show();
                      return;
                  }

                  String[] names = new String[tracks.length];
                  int currentId = mediaPlayer.getSpuTrack();
                  int checkedIndex = 0;

                  for (int i = 0; i < tracks.length; i++) {
                      names[i] = tracks[i].name != null ? tracks[i].name : ("Subtitle " + i);
                      if (tracks[i].id == currentId) checkedIndex = i;
                  }

                  new AlertDialog.Builder(this)
                          .setTitle("Select Subtitles")
                          .setSingleChoiceItems(names, checkedIndex, (dialog, which) -> {
                              mediaPlayer.setSpuTrack(tracks[which].id);
                              Toast.makeText(this, "Subtitle: " + names[which], Toast.LENGTH_SHORT).show();
                              dialog.dismiss();
                          })
                          .show();
              }

              @Override
              public boolean onKeyDown(int keyCode, KeyEvent event) {
                  if (mediaPlayer != null) {
                      if (keyCode == KeyEvent.KEYCODE_DPAD_CENTER || keyCode == KeyEvent.KEYCODE_MEDIA_PLAY_PAUSE) {
                          togglePlayPause();
                          return true;
                      }
                      if (keyCode == KeyEvent.KEYCODE_DPAD_RIGHT || keyCode == KeyEvent.KEYCODE_MEDIA_FAST_FORWARD) {
                          seekBy(10000L);
                          return true;
                      }
                      if (keyCode == KeyEvent.KEYCODE_DPAD_LEFT || keyCode == KeyEvent.KEYCODE_MEDIA_REWIND) {
                          seekBy(-10000L);
                          return true;
                      }
                  }
                  return super.onKeyDown(keyCode, event);
              }

              @Override
              protected void onStop() {
                  super.onStop();
                  if (mediaPlayer != null) mediaPlayer.stop();
              }

              @Override
              protected void onDestroy() {
                  super.onDestroy();
                  if (mediaPlayer != null) {
                      mediaPlayer.detachViews();
                      mediaPlayer.release();
                      mediaPlayer = null;
                  }
                  if (libVLC != null) {
                      libVLC.release();
                      libVLC = null;
                  }
              }
          }
          EOF

          python3 - << 'PYEOF'
          p = "android/app/src/main/java/com/jjmovies/app/MainActivity.java"
          s = open(p, encoding="utf-8").read()
          if "AndroidVlc" not in s:
              s = s.replace(
                  "import android.webkit.WebView;",
                  "import android.content.Intent;\nimport android.webkit.JavascriptInterface;\nimport android.webkit.WebView;"
              )
              bridge_code = """
                  wv.addJavascriptInterface(new Object() {
                      @JavascriptInterface
                      public void playVideo(String url, String title) {
                          runOnUiThread(() -> {
                              Intent intent = new Intent(MainActivity.this, VlcPlayerActivity.class);
                              intent.putExtra(VlcPlayerActivity.EXTRA_VIDEO_URL, url);
                              intent.putExtra(VlcPlayerActivity.EXTRA_VIDEO_TITLE, title);
                              startActivity(intent);
                          });
                      }
                  }, "AndroidVlc");
          """
              s = s.replace("wv.setWebChromeClient(", bridge_code + "\n        wv.setWebChromeClient(", 1)
              open(p, "w", encoding="utf-8").write(s)
          PYEOF
          EOF

      - name: Build APK with Gradle
        working-directory: ./android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Copy Output APK
        run: |
          cp android/app/build/outputs/apk/debug/app-debug.apk ./jj-movies.apk

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: jj-movies-v${{ github.event.inputs.app_version || '1.0.0' }}
          path: ./jj-movies.apk
