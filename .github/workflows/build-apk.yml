name: Build JJ Movies Android APK

on:
  workflow_dispatch:
    inputs:
      app_version:
        description: 'APK Version Number (e.g. 1.0.0, 1.0.1, 1.0.2)'
        required: true
        default: '1.0.0'
      version_code:
        description: 'Android Version Code (Integer: 1, 2, 3...)'
        required: true
        default: '1'

jobs:
  build-apk:
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Checkout Repository Code
        uses: actions/checkout@v4

      - name: ☕ Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: 🟢 Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: 📦 Prepare Web Assets & Inject APK Version
        run: |
          mkdir -p www
          cp index.html app.js style.css www/
          if [ -f admin.html ]; then cp admin.html www/; fi

          # Inject build version into app.js inside APK
          VER="${{ github.event.inputs.app_version || '1.0.0' }}"
          sed -i "1s/^/window.JJ_BUILD_VERSION = '${VER}';\n/" www/app.js

          npm init -y
          npm install @capacitor/core @capacitor/cli @capacitor/android @capacitor/app

          npx cap init "JJ Movies" "com.jjmovies.app" --web-dir www
          npx cap add android

      - name: 🔧 Configure Android Version, Fullscreen & Cleartext
        run: |
          VER_NAME="${{ github.event.inputs.app_version || '1.0.0' }}"
          VER_CODE="${{ github.event.inputs.version_code || '1' }}"
          
          # Update versionCode and versionName in build.gradle
          sed -i "s/versionCode 1/versionCode ${VER_CODE}/g" android/app/build.gradle
          sed -i "s/versionName \"1.0\"/versionName \"${VER_NAME}\"/g" android/app/build.gradle

          MANIFEST="android/app/src/main/AndroidManifest.xml"
          sed -i 's/<application/<application android:usesCleartextTraffic="true" android:hardwareAccelerated="true"/g' "$MANIFEST"
          sed -i 's/android:configChanges="[^"]*"/android:configChanges="orientation|keyboardHidden|keyboard|screenSize|locale|smallestScreenSize|screenLayout|uiMode"/g' "$MANIFEST"

      - name: 🔄 Sync Web Code to Android
        run: npx cap sync android

      - name: 🔨 Build APK with Gradle
        working-directory: ./android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: 🚀 Rename APK with Version
        run: |
          cp android/app/build/outputs/apk/debug/app-debug.apk ./jj-movies.apk

      - name: 📤 Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: jj-movies-v${{ github.event.inputs.app_version || '1.0.0' }}
          path: ./jj-movies.apk
