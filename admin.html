<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>JJ Movies - Admin Panel</title>
<style>
*{box-sizing:border-box}
body{margin:0;font-family:Arial,sans-serif;background:#090d18;color:#f4f5fa}
header{background:#111827;padding:18px 5%;display:flex;justify-content:space-between;align-items:center;border-bottom:1px solid #293044}
header h2{margin:0;color:#ff3867}
main{max-width:1000px;margin:25px auto;padding:0 15px}
.panel{background:#111827;border:1px solid #293044;border-radius:12px;padding:22px;margin-bottom:20px}
h2,h3{margin-top:0}
input:not([type=checkbox]):not([type=file]),textarea,select{display:block;width:100%;margin:8px 0 14px;padding:12px;color:white;background:#090d18;border:1px solid #35405a;border-radius:7px;font-size:15px}
select option{background:#111827;color:white}
input[type=file]{display:block;width:100%;margin:10px 0;padding:12px;background:#090d18;border:1px dashed #56617a;border-radius:7px;color:white}
textarea{min-height:85px;resize:vertical}
label{font-size:14px;color:#c5ccdc}
button{border:0;border-radius:7px;padding:11px 15px;margin:4px 3px 4px 0;background:#ff3867;color:white;font-weight:bold;cursor:pointer}
button.secondary{background:#303a50}
button.danger{background:#b4233d}
button:disabled{opacity:.5;cursor:not-allowed}
.movie-row{border:1px solid #303a50;border-radius:9px;padding:14px;margin:12px 0;display:flex;gap:14px;align-items:flex-start}
.movie-row img{width:70px;min-width:70px;border-radius:5px}
.movie-info{flex:1;min-width:0}
.movie-info p,.muted{color:#b8c0d2;font-size:14px;overflow-wrap:anywhere}
#message{white-space:pre-wrap;overflow-wrap:anywhere}
.hidden{display:none!important}
#posterPreview{display:block;max-width:180px;max-height:260px;object-fit:contain;border-radius:8px;margin:12px 0;border:1px solid #35405a}
.upload-box{background:#090d18;border:1px solid #35405a;border-radius:9px;padding:14px;margin:8px 0 14px}
.checkline{display:flex;gap:9px;align-items:center;margin:14px 0}
.checkline input{width:auto!important;margin:0!important}
hr{border-color:#303a50;margin:24px 0}
@media(max-width:500px){.movie-row{flex-direction:column}header{padding:15px}.panel{padding:15px}}
</style>
</head>
<body>
<header>
  <h2>JJ Movies Admin</h2>
  <button id="logoutBtn" class="secondary hidden">Logout</button>
</header>

<main>
  <div id="message" class="panel">Ready.</div>

  <section id="loginPanel" class="panel">
    <h2>Admin Login</h2>
    <form id="loginForm">
      <label for="email">Email</label>
      <input id="email" type="email" required>
      <label for="password">Password</label>
      <input id="password" type="password" required>
      <button type="submit">Login</button>
    </form>
  </section>

  <section id="adminPanel" class="hidden">
    <div class="panel">
      <h2 id="formTitle">Add Movie</h2>
      <form id="movieForm">
        <label for="title">Movie Title *</label>
        <input id="title" required maxlength="200">

        <label for="year">Release Year</label>
        <input id="year" type="number" min="1888" max="2100">

        <label for="runtime">Runtime</label>
        <input id="runtime" type="text" maxlength="50" placeholder="2h 15m">

        <!-- Independent Category Field -->
        <label for="categoryInput">Category Folder Name *</label>
        <input id="categoryInput" type="text" placeholder="Type category folder (e.g. Marvel, DC, Dubbed)" required>

        <div class="upload-box">
          <label for="posterFile"><strong>Choose poster image</strong></label>
          <input id="posterFile" type="file" accept="image/*">
          <img id="posterPreview" class="hidden" alt="Poster preview">
          <p id="fileInfo" class="muted">Select an image.</p>
          <button type="button" id="uploadBtn">Upload Poster Image</button>
          <button type="button" id="clearImageBtn" class="secondary">Clear</button>
        </div>

        <label for="poster">Poster URL</label>
        <input id="poster" type="url">

        <label for="trailerUrl">Trailer URL</label>
        <input id="trailerUrl" type="url">

        <label for="description">Description</label>
        <textarea id="description"></textarea>

        <label class="checkline">
          <input id="pinned" type="checkbox"> Pin to homepage
        </label>
        <input id="pinLabel" type="text" maxlength="60" placeholder="Custom Pin Label (e.g. 🔥 NEW)">

        <label class="checkline">
          <input id="published" type="checkbox"> Publish on website
        </label>

        <button type="submit" id="saveBtn">Save Movie</button>
        <button type="button" id="cancelBtn" class="secondary hidden">Cancel</button>
      </form>
    </div>

    <div class="panel">
      <h2>Manage Movies & Categories</h2>
      <button id="refreshBtn" class="secondary">Refresh List</button>
      <div id="movieList">Loading...</div>
    </div>
  </section>
</main>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
<script>
(function () {
  "use strict";
  var SUPABASE_URL = "https://tswyabgdldbsaopipvug.supabase.co";
  var SUPABASE_KEY = "sb_publishable_902itkUPAUe272Q4B4jF0w_OEKDNuxr";
  var supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

  var currentUser = null;
  var editingId = null;
  var selectedFile = null;
  var message = document.getElementById("message");
  var loginPanel = document.getElementById("loginPanel");
  var adminPanel = document.getElementById("adminPanel");
  var movieList = document.getElementById("movieList");
  var posterFile = document.getElementById("posterFile");
  var posterPreview = document.getElementById("posterPreview");
  var uploadBtn = document.getElementById("uploadBtn");

  function showMessage(text) { message.textContent = text; }
  function safeHttpUrl(value) {
    try { var p = new URL(value); return p.protocol === "http:" || p.protocol === "https:" ? p.href : ""; } catch(e) { return ""; }
  }
  function makeElement(tag, className, text) {
    var el = document.createElement(tag);
    if (className) el.className = className;
    if (text !== undefined) el.textContent = text;
    return el;
  }

  function setLoggedIn(user) {
    currentUser = user;
    loginPanel.classList.toggle("hidden", !!user);
    adminPanel.classList.add("hidden");
    document.getElementById("logoutBtn").classList.toggle("hidden", !user);
    if (user) checkAdmin();
  }

  async function checkAdmin() {
    var res = await supabase.rpc("is_jj_admin");
    if (res.error || res.data !== true) {
      showMessage("Admin check failed.");
      return;
    }
    adminPanel.classList.remove("hidden");
    loadMovies();
  }

  document.getElementById("loginForm").addEventListener("submit", async function (e) {
    e.preventDefault();
    var res = await supabase.auth.signInWithPassword({
      email: document.getElementById("email").value.trim(),
      password: document.getElementById("password").value
    });
    if (res.error) { showMessage("Login failed: " + res.error.message); return; }
    setLoggedIn(res.data.user);
  });

  document.getElementById("logoutBtn").addEventListener("click", async function () {
    await supabase.auth.signOut();
    setLoggedIn(null);
  });

  posterFile.addEventListener("change", function () {
    selectedFile = posterFile.files && posterFile.files[0];
    if (selectedFile) {
      posterPreview.src = URL.createObjectURL(selectedFile);
      posterPreview.classList.remove("hidden");
      document.getElementById("fileInfo").textContent = selectedFile.name;
    }
  });

  document.getElementById("clearImageBtn").addEventListener("click", function() {
    selectedFile = null;
    posterFile.value = "";
    posterPreview.classList.add("hidden");
    document.getElementById("fileInfo").textContent = "Select an image.";
  });

  uploadBtn.addEventListener("click", async function () {
    if (!selectedFile) { showMessage("Select an image first."); return; }
    uploadBtn.disabled = true;
    var path = currentUser.id + "/" + Date.now() + "-" + selectedFile.name;
    var upRes = await supabase.storage.from("movie-posters").upload(path, selectedFile);
    if (upRes.error) { showMessage("Upload error"); uploadBtn.disabled = false; return; }
    var pubUrl = supabase.storage.from("movie-posters").getPublicUrl(upRes.data.path).data.publicUrl;
    document.getElementById("poster").value = pubUrl;
    posterPreview.src = pubUrl;
    uploadBtn.disabled = false;
    showMessage("Poster uploaded!");
  });

  document.getElementById("movieForm").addEventListener("submit", async function (e) {
    e.preventDefault();
    var movie = {
      title: document.getElementById("title").value.trim(),
      release_year: document.getElementById("year").value ? Number(document.getElementById("year").value) : null,
      runtime: document.getElementById("runtime").value.trim() || null,
      category: document.getElementById("categoryInput").value.trim() || null, // Saving directly to category column
      poster_url: safeHttpUrl(document.getElementById("poster").value.trim()) || null,
      description: document.getElementById("description").value.trim() || null,
      trailer_url: safeHttpUrl(document.getElementById("trailerUrl").value.trim()) || null,
      is_pinned: document.getElementById("pinned").checked,
      pin_label: document.getElementById("pinLabel").value.trim() || null,
      is_published: document.getElementById("published").checked
    };

    var res;
    if (editingId !== null) {
      res = await supabase.from("movies").update(movie).eq("id", editingId);
    } else {
      res = await supabase.from("movies").insert([movie]);
    }
    if (res.error) { showMessage("Error: " + res.error.message); return; }
    showMessage("Movie saved successfully!");
    document.getElementById("movieForm").reset();
    posterPreview.classList.add("hidden");
    editingId = null;
    loadMovies();
  });

  async function loadMovies() {
    var res = await supabase.from("movies").select("*").order("created_at", { ascending: false });
    movieList.innerHTML = "";
    var movies = res.data || [];
    if (!movies.length) { movieList.textContent = "No movies."; return; }

    movies.forEach(function (movie) {
      var row = makeElement("div", "movie-row");
      if (movie.poster_url) {
        var img = document.createElement("img");
        img.src = movie.poster_url;
        img.onerror = function() { img.style.display = 'none'; };
        row.appendChild(img);
      }
      var info = makeElement("div", "movie-info");
      info.appendChild(makeElement("h3", "", movie.title));

      var catLabel = makeElement("label", "", "Category Folder Name:");
      var catInput = document.createElement("input");
      catInput.type = "text";
      catInput.value = movie.category || "";

      var saveCatBtn = makeElement("button", "secondary", "Save Category");
      saveCatBtn.addEventListener("click", async function() {
        var uRes = await supabase.from("movies").update({ category: catInput.value.trim() }).eq("id", movie.id);
        if (uRes.error) {
          showMessage("Failed: " + uRes.error.message);
        } else {
          showMessage("Category folder updated to: " + catInput.value.trim());
          loadMovies();
        }
      });

      info.appendChild(catLabel);
      info.appendChild(catInput);
      info.appendChild(saveCatBtn);

      var delBtn = makeElement("button", "danger", "Delete");
      delBtn.addEventListener("click", async function() {
        if (confirm("Delete movie?")) {
          await supabase.from("movies").delete().eq("id", movie.id);
          loadMovies();
        }
      });
      info.appendChild(delBtn);
      row.appendChild(info);
      movieList.appendChild(row);
    });
  }

  document.getElementById("refreshBtn").addEventListener("click", loadMovies);
  supabase.auth.getSession().then(function (res) {
    setLoggedIn(res.data.session ? res.data.session.user : null);
  });
})();
</script>
</body>
</html>
